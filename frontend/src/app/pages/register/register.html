<div class="container">
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">S'inscrire</h5>
                    <form (ngSubmit)="onSubmit()" class="">
                        <div class="mb-3">
                            <label for="email" class="form-label">Addresse email</label>
                            <input type="email" class="form-control" id="email" name="email" [(ngModel)]="user.email">
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Nom d'utilisateur</label>
                            <input type="text" class="form-control" id="username" name="username"
                                [(ngModel)]="user.username">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mot de passe</label>
                            <input type="password" class="form-control" id="password" name="password"
                                [(ngModel)]="user.password">
                        </div>
                        <button type="submit" class="btn btn-primary">S'inscrire</button>

                        <div class="register-link">
                            <a routerLink="/login">Déjà un compte ? Se connecter</a>
                        </div>

                        @if(isErrorMessage()) {
                        <div class="container">
                            <div class="alert alert-danger" role="alert">
                                {{ errorMessage() }}
                            </div>
                        </div>
                        }
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
