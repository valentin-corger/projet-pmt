version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: pmt-db
    environment:
      POSTGRES_DB: iscodPMT
      POSTGRES_USER: valentincorger
      POSTGRES_PASSWORD: pmt1234
    ports:
      - "5432:5432"
    volumes:
      - pmt-db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: pmt-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/iscodPMT
      SPRING_DATASOURCE_USERNAME: valentincorger
      SPRING_DATASOURCE_PASSWORD: pmt1234
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pmt-db-data:
